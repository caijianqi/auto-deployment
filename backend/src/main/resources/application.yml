server:
  port: 8080

spring:
  application:
    name: auto-deployment
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:data/deploy.db
    username: sa
    password: sa
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
      location: data/tmp
  tomcat:
    max-swallow-size: -1

mybatis-plus:
  configuration:
    map-underline-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# Custom configuration for file paths
deploy:
  path:
    backups: data/backups

logging:
  file:
    path: data/logs
